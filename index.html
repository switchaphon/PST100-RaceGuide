<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>PST100 Race Day</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0b0f14;--card:#151c25;--card2:#1c2531;--tx:#eef2f7;--mut:#8fa0b3;--ok:#3ddc84;--warn:#ffb020;--bad:#ff5a5f;--acc:#4da3ff;--line:#26313f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Sarabun",sans-serif}
body{padding:0 12px calc(86px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;font-size:17px;line-height:1.35}
header{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line);z-index:5}
.hrow{display:flex;justify-content:space-between;align-items:flex-end}
.strip{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.sv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.sub{color:var(--mut);font-size:13px}
.right{text-align:right}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.card h2{margin:0 0 6px;font-size:14px;color:var(--mut);font-weight:600;text-transform:none}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.mid{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.row>div{flex:1;background:var(--card2);border-radius:10px;padding:10px}
.row .lab{font-size:12px;color:var(--mut)}
.good{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--acc)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:18px;font-size:22px;font-weight:800;color:#06120b;background:var(--ok);margin:10px 0}
.btn.alt{background:var(--acc);color:#04101e}
.btn.ghost{background:var(--card2);color:var(--tx);font-size:16px;padding:12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:14px;padding:4px 9px;border-radius:99px;background:var(--card2)}
.chip.y{background:#12351f;color:var(--ok)}.chip.n{background:#3a1519;color:var(--bad);text-decoration:line-through}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
ul.chk{list-style:none;margin:6px 0 0;padding:0}
ul.chk li{padding:11px 10px;margin:6px 0;background:var(--card2);border-radius:10px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
ul.chk li.done{opacity:.45;text-decoration:line-through}
ul.chk li:before{content:"\2610";font-size:22px;line-height:1}
ul.chk li.done:before{content:"\2611";color:var(--ok)}
.tip{background:var(--card2);border-radius:10px;padding:10px;margin-top:8px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
tr.cur td{background:#14283d}
nav{position:fixed;left:0;right:0;bottom:0;background:#0e141bf2;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:14px 4px;font-size:16px;font-weight:700}
nav button.on{color:var(--acc);border-top:3px solid var(--acc);padding-top:11px}
select,input{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px}
input.s{width:64px;text-align:center}
.small{font-size:13px;color:var(--mut)}
svg text{font-family:inherit}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:15px;font-weight:700}
.seg button.on{background:var(--acc);color:#04101e;border-color:var(--acc)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}
.kv:last-child{border:0}.kv b{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip.bag{background:#fde047;color:#1a1400;font-weight:800;border:1px solid #fff59d;box-shadow:0 0 10px #fde04799}
.ic{display:inline-flex;width:34px;height:34px;border-radius:10px;align-items:center;justify-content:center;border:1px solid transparent}
.ic.sm{width:26px;height:26px;border-radius:8px}
.ic.no{background:#2a1517;border-color:#5b2327;color:#ff5a5f;font-weight:800;font-size:15px}
.ic.un{color:#4a5666}
.ic.bag{background:#fde047;border-color:#fff59d;box-shadow:0 0 10px #fde047aa}
table.mx td,table.mx th{text-align:center;padding:4px 1px}
table.mx td.mid-id{text-align:left;padding-left:6px;font-size:14px}
table.mx .ml{font-size:9px;line-height:1.1;margin-top:2px;font-weight:700}
.blk{border-top:1px solid var(--line);padding:6px 0 4px}
.blk.cur{background:#14283d;border-radius:8px}
.r1{display:grid;grid-template-columns:84px 1fr 1fr 1fr 40px;gap:2px;align-items:start;font-size:15px;font-variant-numeric:tabular-nums;text-align:center}
.r1>div:first-child{text-align:left;padding-left:4px}
.r1.hd{font-size:12px;color:var(--mut);font-weight:600;padding-bottom:6px;line-height:1.2}
.r2{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-top:5px}
.r2.hd{border-bottom:1px solid var(--line);padding-bottom:6px}
.r2.hd .ml{font-size:9px;line-height:1.1;margin-top:2px;font-weight:700}
.bagtag{max-width:64px;line-height:1.1;white-space:normal;display:inline-flex;align-items:center;gap:3px;background:#fde047;color:#1a1400;font-weight:800;font-size:10px;border-radius:6px;padding:2px 5px;margin-top:3px;box-shadow:0 0 8px #fde047aa}
.r3{display:grid;grid-template-columns:84px repeat(7,1fr);align-items:center;text-align:center}
.r3 .idc{text-align:left;padding-left:4px}
.r3.hd{border-bottom:1px solid var(--line);padding-bottom:6px;align-items:start}
.r3.hd .ml{font-size:9px;line-height:1.1;margin-top:2px;font-weight:700}
.ctr{padding:3px 0}
.hero .st{font-size:15px;font-weight:700;color:var(--acc);margin-bottom:6px}
.hero .lab,.ns .lab,.g2 .lab,.g3 .lab{font-size:12px;color:var(--mut)}
.g2,.g3{display:grid;gap:8px;margin-top:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.g2>div,.g3>div{background:var(--card2);border-radius:10px;padding:8px 10px}
.g2 .v,.g3 .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.nsname{font-size:24px;font-weight:800;margin:2px 0}
.rec{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin:-2px 2px 8px}
.adj{display:flex;gap:4px}
.adj button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><div class="sub">Time of Day · <span data-k="date"></span></div><div class="clock" data-k="clock">--:--:--</div><div class="sub" data-k="sim"></div></div>
    <div class="right"><div class="sub">Race time</div><div class="clock acc" data-k="elapsed">-</div><div class="sub" data-k="raceclk"></div></div>
  </div>
  <div class="strip">
    <div><div class="sub">เทียบแผน</div><div class="sv" data-k="hdDelta">—</div></div>
    <div class="right"><div class="sub" data-k="hdCutLab">Cut-off ถัดไป</div><div class="sv" data-k="hdCut">—</div></div>
  </div>
</header>
<main id="main"></main>
<nav>
  <button id="t-now" onclick="setTab('now')">ตอนนี้</button>
  <button id="t-map" onclick="setTab('map')">กราฟ/GPS</button>
  <button id="t-all" onclick="setTab('all')">ทุกจุด</button>
  <button id="t-set" onclick="setTab('set')">ตั้งค่า</button>
</nav>

<script>
"use strict";
/* ---------- DATA (source: pst.mytrails.run official table + official aid-station graphic) ---------- */
var START = Date.parse('2026-11-14T05:00:00+07:00');
var H24 = 24*60;
// index: 0 START,1 A1,2 A2,3 A3,4 A4,5 A5,6 A6,7 W0,8 A7,9 A8,10 FINISH
var P = [
 {id:'START',n:'วัดวิมุตติการาม',km:0,   cut:0,   crew:1,sup:[0,0,0,0,0,0,0],gain:750,loss:179,
  arrive:[],
  leg:'ช่วงเปิดตัว: ขึ้นเขาต่อเนื่อง +750 ม. ใน 12.4 กม. ออกช้า ๆ อย่าเร่ง ใจเย็นช่วง 2 ชม.แรก'},
 {id:'A1',n:'ปางมะโอ',km:12.4, cut:230, crew:0,sup:[1,1,1,1,1,0,0],gain:576,loss:607,
  arrive:['เติมน้ำเต็มขวด + Pocari','กินเจล/ขนมที่พกมา (ไม่มีอาหารร้อนที่นี่)','ซัพพอร์ตเข้าไม่ได้ ใช้ของที่พกเอง'],
  leg:'ลูกคลื่นขึ้นลงพอ ๆ กัน 12.3 กม. รักษาจังหวะ ไม่ต้องรีบ'},
 {id:'A2',n:'วัดหลวงขุนวิน',km:24.7, cut:460, crew:1,sup:[1,1,1,1,1,1,0],gain:277,loss:904,
  arrive:['กินมื้อจริง (อาหารร้อน)','เติมน้ำ + Pocari เต็ม','ซัพพอร์ต: เปลี่ยนถุงเท้า/เติมของ ถ้ามี','ถัดไป A3 ไม่มีอาหารร้อน กินให้พอก่อนออก'],
  leg:'ลงยาว -904 ม. ใน 13.8 กม. อย่าเร่งจนต้นขาพัง เก็บแรงไว้ช่วงกลางคืน'},
 {id:'A3',n:'สันปูเลย',km:38.5, cut:645, crew:1,sup:[1,1,1,1,1,0,0],gain:508,loss:429,
  arrive:['เติมน้ำ + Pocari','ผลไม้/ขนม ไม่มีอาหารร้อน','ซัพพอร์ต: เติมเจล/เกลือแร่'],
  leg:'ขึ้นลงปานกลาง 13.3 กม. ช่วงบ่ายอาจร้อน ดื่มน้ำสม่ำเสมอ'},
 {id:'A4',n:'วัดนิลประภา',km:51.8, cut:870, crew:1,sup:[1,1,1,1,1,1,0],gain:594,loss:634,
  arrive:['กินอาหารร้อน','เติมน้ำเต็ม','เตรียมไฟฉายตัวที่ 1 ไว้ใช้ได้ทันที (ใกล้มืด)','ซัพพอร์ต: เสื้อ/แบตสำรองสำหรับกลางคืน'],
  leg:'9.9 กม. +594/-634 ถึง A5 ราวเริ่มมืด ไฟฉายติดหัวได้เลย'},
 {id:'A5',n:'บ้านปง (Dropped bag)',km:61.7, cut:1055, crew:1,sup:[1,1,1,1,1,1,1],gain:1117,loss:207,
  arrive:['รับ Dropped bag (Special Need Bag) ที่ฝากไว้ตอนสตาร์ท','กินมื้อใหญ่ (อาหารร้อน)','เปลี่ยนเสื้อแห้ง/ถุงเท้า','ไฟฉาย + แบตสำรอง เช็คว่าติด','เติมน้ำเต็ม + อาหารพอไป A7 (~25 กม. ไม่มีซัพพอร์ต)','นี่คือจุดซัพพอร์ตจุดสุดท้ายก่อน A7'],
  leg:'ช่วงโหด +1,117 ม. ใน 10.3 กม. ขึ้นช้า ๆ ใช้โพล/ถุงมือ ระวังงู ไปเป็นกลุ่มถ้าทำได้'},
 {id:'A6',n:'บ้านม้งดอยปุย',km:72.0, cut:1330, crew:0,sup:[1,1,1,1,1,1,0],gain:450,loss:483,
  arrive:['กินอาหารร้อนให้พอ (ถัดไป W0 ไม่มีอาหาร)','เติมน้ำเต็ม','ซัพพอร์ตเข้าไม่ได้','ใส่เสื้อกันหนาวถ้าเย็น (พื้นที่สูง)'],
  leg:'กลางคืน บนพื้นที่สูง +450/-483 ถึง W0 ระวังหลงทาง ตามริบบิ้นสะท้อนแสง'},
 {id:'W0',n:'ทางแยก (Crossroads)',km:80.8, cut:1500, crew:0,sup:[1,1,1,1,0,0,0],gain:41,loss:758,
  arrive:['06:00 คือ "เวลาแนะนำ" ไม่ใช่ cut-off','เติมน้ำ/Pocari ผ่านเร็ว ไม่มีห้องน้ำ ไม่มีอาหารร้อน','ซัพพอร์ตเข้าไม่ได้','เตรียมโพล/ปรับสายเป้ ก่อนลงชัน'],
  leg:'ลงชัน -758 ม. ใน 5.9 กม. (ชันสุดของสนาม) ถนอมเข่า/ต้นขา ก้าวสั้น ใช้โพล'},
 {id:'A7',n:'แม่แมะ',km:86.7, cut:1595, crew:1,sup:[1,1,1,1,1,1,0],gain:151,loss:335,
  arrive:['กินอาหารร้อน','ห้องน้ำ','เติมน้ำ + Pocari','ซัพพอร์ต: เปลี่ยนรองเท้า/ถุงเท้า ถ้าจำเป็น'],
  leg:'10.8 กม. +151/-335 ทางเรียบกว่าแล้ว ฝึกจังหวะให้คงที่'},
 {id:'A8',n:'ห้วยตึงเฒ่า',km:97.5, cut:1770, crew:1,sup:[1,1,1,1,1,1,0],gain:268,loss:283,
  arrive:['กินอาหารร้อนเบา ๆ','เติมน้ำพอถึงเส้นชัย','ซัพพอร์ตเข้าได้'],
  leg:'8.3 กม. สุดท้าย มีเนินปลาย ๆ อีก +268 ม. เหลืออีกนิดเดียว'},
 {id:'FIN',n:'CMECC เส้นชัย',km:105.8, cut:1920, crew:1,sup:[1,1,1,1,1,1,1],gain:0,loss:0,arrive:[],leg:''}
];

var DEF_PLAN=[0,136,283,438,596,738,907,1033,1111,1238,1350];
var DEF_STOP=[0,7,7,7,7,7,7,0,7,7,0];

/* ---------- STATE ---------- */
var S={arr:{},dep:{},hist:[],sim:0,plan:null,stop:null,chk:{},tab:'now',back:0};
try{var raw=localStorage.getItem('pst100_v1');if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k];}}catch(e){}
// records made long before race day without test mode were accidental taps: clear them
try{if(S.dep&&S.dep[0]!=null&&!S.sim&&S.dep[0]<START-2*3600000){S.arr={};S.dep={};S.hist=[];S.chk={}}}catch(e){}
function save(){try{localStorage.setItem('pst100_v1',JSON.stringify(S));}catch(e){}}
function plan(){return S.plan||DEF_PLAN}
function stp(){return S.stop||DEF_STOP}
function now(){return Date.now()+(S.sim||0)}
function planArr(i){return plan()[i]}
function planDep(i){return plan()[i]+stp()[i]}

/* ---------- FORMAT ---------- */
function p2(n){return (n<10?'0':'')+n}
function clock(ms){var d=new Date(ms+7*3600000);var h=d.getUTCHours(),m=d.getUTCMinutes();var day=d.getUTCDate();var t=p2(h)+':'+p2(m);return day===14?t:t+' (อา.)'}
function clockS(ms){var d=new Date(ms+7*3600000);return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds())}
function dur(min){var neg=min<0;min=Math.abs(Math.round(min));var h=Math.floor(min/60),m=min%60;return (neg?'-':'')+h+':'+p2(m)}
function mmss(ms){var neg=ms<0;var s=Math.floor(Math.abs(ms)/1000);var h=Math.floor(s/3600);var m=Math.floor(s%3600/60);return (neg?'-':'')+(h?h+':'+p2(m):m)+':'+p2(s%60)}
function hm(min){var neg=min<0;min=Math.abs(Math.round(min));var h=Math.floor(min/60),m=min%60;return (neg?'-':'')+(h?h+' ชม. ':'')+m+' น.'}
function deltaTxt(d){ // d minutes, positive = behind plan
  if(d>0.5)return ['ช้ากว่าแผน '+hm(d),'warn'];
  if(d<-0.5)return ['เร็วกว่าแผน '+hm(-d),'good'];
  return ['ตรงแผน','good'];
}
var WD=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'],MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function dateTh(ms){var d=new Date(ms+7*3600000);return WD[d.getUTCDay()]+' '+d.getUTCDate()+' '+MN[d.getUTCMonth()]}
function hms(ms){var s=Math.floor(Math.abs(ms)/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)}
function cdown(ms){var s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400);s-=d*86400;var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (d?d+' วัน ':'')+p2(h)+':'+p2(m)+':'+p2(s%60)}
function hmsShort(ms){var s=Math.floor(Math.abs(ms)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h>=24?Math.floor(h/24)+' วัน '+(h%24)+' ชม.':h+':'+p2(m)}
function parseHM(s){var m=/^(\d{1,2}):(\d{2})$/.exec((s||'').trim());return m?(+m[1])*60+(+m[2]):null}

/* ---------- MODEL ---------- */
function model(){
  var n=now(),m={now:n},last=0,i;
  if(S.dep[0]==null){m.mode='pre';m.toStart=START-n;return m}
  for(i=1;i<=10;i++){if(S.arr[i]!=null)last=i}
  m.last=last;
  if(last===10){m.mode='done';return m}
  if(last>=1&&S.dep[last]==null){m.mode='atcp'}else{m.mode='enroute'}
  return m;
}
function legPlan(from,to){return planArr(to)-planDep(from)}
function finishProj(deltaMin){return START+(planArr(10)+deltaMin)*60000}

/* ---------- ACTIONS ---------- */
function backMs(){return (S.back||0)*60000}
function act(kind,i){
  var t=now();
  if(kind==='dep'){S.dep[i]=t}else{S.arr[i]=t}
  S.hist.push([kind,i]);S.back=0;save();render();
}
function undo(){var h=S.hist.pop();if(!h)return;if(h[0]==='dep')delete S.dep[h[1]];else delete S.arr[h[1]];save();render()}
function adjLast(min){var h=S.hist[S.hist.length-1];if(!h)return;var o=h[0]==='dep'?S.dep:S.arr;o[h[1]]+=min*60000;save();render()}
function testStart(){S.sim=START-Date.now();S.dep[0]=START;S.hist=[['dep',0]];save();render()}
function toggleChk(k){S.chk[k]=!S.chk[k];save();render()}
function setTab(t){S.tab=t;save();render()}
function resetAll(){if(confirm('ล้างข้อมูลที่บันทึกทั้งหมด?')){S.arr={};S.dep={};S.hist=[];S.chk={};S.back=0;save();render()}}
function setSim(v){if(!v){S.sim=0}else{var ms=Date.parse(v+':00+07:00');if(!isNaN(ms))S.sim=ms-Date.now()}save();render()}
function savePlan(){
  var pl=[],st=[],ok=true;
  pl.push(0);st.push(0);
  for(var i=1;i<=10;i++){
    var a=document.getElementById('pa'+i),s=document.getElementById('ps'+i);
    var v=parseHM(a.value);if(v===null){ok=false;a.style.borderColor='var(--bad)'}
    pl.push(v);st.push(Math.max(0,+s.value||0));
  }
  if(!ok)return;S.plan=pl;S.stop=st;save();render();
}
function resetPlan(){S.plan=null;S.stop=null;save();render()}

function svgIc(it,sz,col){
  if(it.t)return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24"><text x="12" y="16.5" text-anchor="middle" font-size="11.5" font-weight="800" fill="'+col+'" style="font-family:system-ui,sans-serif">'+it.t+'</text></svg>';
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+it.p+'</svg>';
}
function supVal(i,k){ // 1 yes, 0 no, null unknown
  if(k===7)return P[i].crew;
  if(i===0)return k===6?1:null;
  return P[i].sup[k];
}
function chips(i){
  var h='';
  for(var k=0;k<8;k++){
    var it=ITEMS[k],v=supVal(i,k);
    if(v==null)continue;
    if(k===6&&!v)continue;
    if(!v){h+='<span class="chip n">'+it.l+'</span>';continue}
    if(it.bag)h+='<span class="chip bag">'+svgIc(it,16,'#1a1400')+' '+it.l+'</span>';
    else h+='<span class="chip" style="background:'+it.c+'26;color:'+it.c+';border:1px solid '+it.c+'66">'+svgIc(it,16,it.c)+' '+it.l+'</span>';
  }
  return h;
}
function icCell(i,k){
  var it=ITEMS[k],v=supVal(i,k);
  if(v==null)return '<td><span class="ic un">·</span></td>';
  if(!v)return k===6?'<td><span class="ic un">·</span></td>':'<td><span class="ic no">✕</span></td>';
  if(it.bag)return '<td><span class="ic bag">'+svgIc(it,22,'#1a1400')+'</span></td>';
  return '<td><span class="ic" style="background:'+it.c+'2b;border-color:'+it.c+'88">'+svgIc(it,20,it.c)+'</span></td>';
}

}

/* ---------- LIVE VALUES ---------- */
function dShort(d){if(d>0.5)return ['+'+Math.round(d)+' น. ช้ากว่า','warn'];if(d<-0.5)return ['−'+Math.round(-d)+' น. เร็วกว่า','good'];return ['ตรงแผน','good']}
function nextCut(j){if(j===7)j=8;return j>10?null:j}
function live(){
  var m=model(),n=now(),o={};
  o.clock=[clockS(n),''];
  o.date=[dateTh(n),''];
  o.sim=[S.sim?'โหมดจำลองเวลา':'',''];
  o.elapsed=[m.mode==='pre'?'00:00:00':hms(n-START),''];
  o.raceclk=[m.mode==='pre'?'ปล่อยตัวอีก '+cdown(START-n):'หลังปล่อยตัว 05:00',''];
  var delta=null,cj=null;
  if(m.mode==='pre'){o.toStart=[cdown(START-n),''];cj=1}
  if(m.mode==='enroute'){
    var L=m.last,to=L+1,dep=S.dep[L],used=(n-dep)/60000,pl=legPlan(L,to);
    var eta=Math.max(dep+pl*60000,n);
    delta=(eta-(START+planArr(to)*60000))/60000;cj=nextCut(to);
    o.barw=[Math.min(100,used/pl*100)+'%',''];
    o.used=[hm(used),used>pl?'bad':''];
    var lf=pl-used;o.legLeft=[lf>=0?dur(lf):'เกิน '+dur(-lf),lf>=0?'':'bad'];
    o.nsEta=[clockS(eta).slice(0,5),delta>0.5?'warn':'good'];
  }
  if(m.mode==='atcp'){
    var i=m.last,ar=S.arr[i],dl2=(ar-(START+planArr(i)*60000))/60000,t2=deltaTxt(dl2);
    var left=stp()[i]*60000-(n-ar);
    o.stopLeft=[mmss(left),left>60000?'good':(left>0?'warn':'bad')];

  return P[10].km;
}
function sumGL(k0,k1){var p=RT.p,i0=kmToIdx(k0),i1=kmToIdx(k1),g=0,l=0,i;for(i=i0+1;i<=i1;i++){var d=p[i].e-p[i-1].e;if(d>0)g+=d;else l-=d}return [g*RT.gs,l*RT.ls]}

/* ---------- PROFILE GRAPH ---------- */
function profileSvg(x0,x1,cur){
  var W=640,H=250,L=40,R=8,T=14,B=26,p=RT.p,i;
  var ymin=300,ymax=1550;
  function X(k){return L+(k-x0)/(x1-x0)*(W-L-R)}
  function Y(e){return T+(1-(e-ymin)/(ymax-ymin))*(H-T-B)}
  var pts=[],d='';
  for(i=0;i<p.length;i++){if(p[i].k<x0-1||p[i].k>x1+1)continue;pts.push(X(p[i].k).toFixed(1)+','+Y(p[i].e).toFixed(1))}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  [400,600,800,1000,1200,1400].forEach(function(e){svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(e)+'" y2="'+Y(e)+'" stroke="#26313f"/><text x="'+(L-4)+'" y="'+(Y(e)+4)+'" fill="#8fa0b3" font-size="11" text-anchor="end">'+e+'</text>'});
  if(pts.length)svg+='<polygon points="'+X(Math.max(x0,0))+','+Y(ymin)+' '+pts.join(' ')+' '+X(Math.min(x1,105.8))+','+Y(ymin)+'" fill="#1f5fa8" opacity=".85"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="#6db3ff" stroke-width="1.5"/>';
  // CPs
  for(i=1;i<=10;i++){var k=cpKm(i);if(k<x0-0.5||k>x1+0.5)continue;
    var done=(i===0)?true:S.arr[i]!=null;
    svg+='<line x1="'+X(k)+'" x2="'+X(k)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="'+(done?'#3ddc84':'#8fa0b3')+'" stroke-dasharray="3 3" opacity=".8"/>'
       +'<text x="'+X(k)+'" y="'+(H-B+13)+'" fill="'+(done?'#3ddc84':'#eef2f7')+'" font-size="11" font-weight="700" text-anchor="middle">'+P[i].id+'</text>';}
  // peaks
  PEAKS.forEach(function(ix){var k=p[ix].k;if(k<x0||k>x1)return;svg+='<text x="'+X(k)+'" y="'+(Y(p[ix].e)-5)+'" fill="#ffb020" font-size="11" text-anchor="middle">▲'+Math.round(p[ix].e)+'</text>'});
  // plan-time position
  var m=model();
  if(m.mode!=='pre'&&m.mode!=='done'){var pk=planKmAt((now()-START)/60000);if(pk>=x0&&pk<=x1)svg+='<circle cx="'+X(pk)+'" cy="'+Y(eleAt(pk))+'" r="6" fill="none" stroke="#fff" stroke-width="2"/>'}
  // last recorded CP
  if(m.mode==='atcp'||m.mode==='enroute'){var lk=cpKm(m.last);if(lk>=x0&&lk<=x1)svg+='<rect x="'+(X(lk)-5)+'" y="'+(Y(eleAt(lk))-5)+'" width="10" height="10" fill="#3ddc84" transform="rotate(45 '+X(lk)+' '+Y(eleAt(lk))+')"/>'}
  // gps
  if(G.km!=null&&G.off<=2000&&G.km>=x0&&G.km<=x1)svg+='<circle cx="'+X(G.km)+'" cy="'+Y(eleAt(G.km))+'" r="8" fill="#ff5a5f" stroke="#fff" stroke-width="2"/>';
  return svg+'</svg>';
}

function viewMap(m){
  var h='';
  var win=S.gz||'next';
  var curKm=(G.km!=null)?G.km:null;
  var base=curKm!=null?curKm:(m.last!=null?cpKm(m.last):0);
  var x0=0,x1=105.8;
  if(win==='next'){x0=Math.max(0,base-3);x1=Math.min(105.8,x0+30);x0=Math.max(0,x1-30)}
  h+='<div class="seg"><button class="'+(win==='next'?'on':'')+'" onclick="S.gz=\'next\';save();render()">ช่วงถัดไป 30 กม.</button><button class="'+(win==='all'?'on':'')+'" onclick="S.gz=\'all\';save();render()">ทั้งเส้นทาง</button></div>';
  h+='<div class="card" style="padding:8px">'+profileSvg(x0,x1)+'<div class="small" style="padding:4px 6px">● แดง = ตำแหน่ง GPS · ○ ขาว = ที่ควรอยู่ตามแผนเวลาตอนนี้ · ◆ เขียว = จุดที่บันทึกล่าสุด · ▲ = ยอด · เส้นเขียว = จุดที่ผ่านแล้ว</div></div>';
  // GPS controls
  h+='<div class="card"><h2>GPS</h2>';
  if(!G.on)h+='<button class="btn alt" onclick="gpsStart()">เปิด GPS ติดตามตำแหน่ง</button><div class="small">GPS ในมือถือทำงานได้โดยไม่ต้องมีเน็ต แต่กินแบตเพิ่ม เปิดเฉพาะตอนอยากเช็กตำแหน่ง แล้วกดปิด</div>';
  else h+='<button class="btn ghost" onclick="gpsStop()">ปิด GPS</button>';
  if(G.err)h+='<div class="tip warn">'+G.err+'</div>';
  var farOff=G.km!=null&&G.off>2000;
  if(farOff){h+='<div class="tip">GPS ใช้งานได้ ✓ ความแม่นยำ ±'+Math.round(G.acc||0)+' ม. · แต่ตอนนี้คุณอยู่ห่างจากเส้นทาง '+(G.off/1000).toFixed(1)+' กม. จึงยังไม่แสดงระยะถึงจุดถัดไป (จะแสดงเมื่ออยู่ในสนาม)</div>';}
  if(G.km!=null&&!farOff){
    var nx=null,i;for(i=1;i<=10;i++){if(cpKm(i)>G.km+0.05){nx=i;break}}
    var age=Math.round((now()-G.t)/1000);
    h+='<div class="kv"><span>ตำแหน่งบนเส้นทาง</span><b>กม. '+G.km.toFixed(1)+' / 105.8</b></div>'
     +'<div class="kv"><span>ความสูง (ประมาณ)</span><b>'+Math.round(eleAt(G.km))+' ม.</b></div>'
     +'<div class="kv"><span>ห่างจากเส้นทาง</span><b class="'+(G.off>150?'bad':'good')+'">'+Math.round(G.off)+' ม.'+(G.off>150?' (หลงทาง?)':'')+'</b></div>'
     +'<div class="kv"><span>ความแม่นยำ GPS · อัปเดตเมื่อ</span><b>±'+Math.round(G.acc||0)+' ม. · '+age+' วิ ที่แล้ว</b></div>';
    if(nx){var gl=sumGL(G.km,cpKm(nx));
      h+='<div class="kv"><span>ถึง '+P[nx].id+' '+P[nx].n+'</span><b>อีก '+(cpKm(nx)-G.km).toFixed(1)+' กม.</b></div>'
       +'<div class="kv"><span>ไต่/ลง ที่เหลือถึง '+P[nx].id+'</span><b>+'+Math.round(gl[0])+' / -'+Math.round(gl[1])+' ม.</b></div>';}
    var pk=null;for(i=0;i<PEAKS.length;i++){if(RT.p[PEAKS[i]].k>G.km+0.1){pk=RT.p[PEAKS[i]];break}}
    if(pk){var g2=sumGL(G.km,pk.k);h+='<div class="kv"><span>ยอดถัดไป ▲'+Math.round(pk.e)+' ม.</span><b>อีก '+(pk.k-G.km).toFixed(1)+' กม. · ไต่อีก +'+Math.round(g2[0])+' ม.</b></div>'}
    var plk=planKmAt((now()-START)/60000),df=G.km-plk;
    if(now()>=START)h+='<div class="kv"><span>เทียบแผนเวลา (ตอนนี้ควรอยู่ กม. '+plk.toFixed(1)+')</span><b class="'+(df>=0?'good':'warn')+'">'+(df>=0?'นำ ':'ตาม ')+Math.abs(df).toFixed(1)+' กม.</b></div>';
  }
  h+='<div class="small" style="margin-top:8px">ตำแหน่ง CP และกราฟคำนวณจากเส้นทางบนเว็บผู้จัด (ยังไม่ใช่ GPX ทางการ) คลาดเคลื่อนได้ราว 1–2 กม. ใช้เป็นแนวทาง ไม่ใช่ตัวตัดสิน cut-off เมื่อได้ GPX ทางการแล้วจะอัปเดตให้แม่นขึ้น</div></div>';
  // --- test tools ---
  h+='<div class="card"><h2>ทดสอบ (ก่อนวันแข่ง)</h2>'
   +'<div class="kv"><span>เปิดไฟล์แบบ</span><b>'+location.protocol+'</b></div>'
   +'<div class="kv"><span>Secure context</span><b class="'+(window.isSecureContext?'good':'bad')+'">'+(window.isSecureContext?'ใช่':'ไม่')+'</b></div>'
   +'<div class="kv"><span>GPS รองรับ</span><b class="'+(navigator.geolocation?'good':'bad')+'">'+(navigator.geolocation?'ใช่':'ไม่')+'</b></div>'
   +'<div class="kv"><span>สิทธิ์ตำแหน่ง</span><b>'+(G.perm||'ไม่ทราบ')+'</b></div>';
  h+='<button class="btn ghost" onclick="gpsOnce()">ทดสอบ GPS 1 ครั้ง (ไม่เทียบเส้นทาง)</button>';
  if(G.test)h+='<div class="tip">'+G.test+'</div>';
  h+='<div class="small" style="margin-top:10px">ทดสอบกราฟโดยไม่ใช้ GPS: เลื่อนตำแหน่งจำลองบนเส้นทาง (ปล่อยนิ้วแล้วกราฟจะย้ายจุด)</div>'
   +'<input type="range" min="0" max="105.8" step="0.1" value="'+(G.demo&&G.km!=null?G.km:0)+'" style="width:100%;margin-top:8px" onchange="gpsDemo(+this.value)">'
   +(G.demo?'<button class="btn ghost" onclick="gpsClear()">ล้างตำแหน่งจำลอง</button>':'')
   +'<div class="small" style="margin-top:8px">เคล็ดลับทดสอบ GPS จริง: เดินออกไปที่โล่งนอกอาคาร 5 นาที กด "เปิด GPS" จะต้องเห็นค่าความแม่นยำ ±10–20 ม. (ระยะห่างจากเส้นทางจะเป็นพันเมตรเพราะไม่ได้อยู่บนสนาม ซึ่งเป็นเรื่องปกติ) ทดสอบแบบโหมดเครื่องบินด้วยก็ได้ GPS ยังทำงาน</div></div>';
  return h;
}

render();
setInterval(applyLive,1000);
setInterval(function(){if(S.tab==='map'&&G.on)render()},15000);
</script>
