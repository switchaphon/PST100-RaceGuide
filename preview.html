function tC(ms,o){o=o||{};var d=new Date(ms+7*3600000);var t=p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+(o.sec?':'+p2(d.getUTCSeconds()):'');

function tDur(sec,o){o=o||{};var neg=sec<0;sec=Math.abs(Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60,out='',dd=0;
  if(o.days&&h>=24){dd=Math.floor(h/24);h%=24;out+=dd+U('d')+' '}
  var showH=h||dd||o.fh;if(showH)out+=h+U('hr')+' ';

function finFor(pid,m){
  var X=planOf(pid),n=m.now,L,to,i;

    var e0=Math.max(S.dep[L]+(X.p[to]-X.p[L]-X.s[L])*60000,n);return e0+(X.p[10]-X.p[to])*60000}
  i=m.last;var dp=Math.max(n,S.arr[i]+X.s[i]*60000);return dp+(X.p[10]-X.p[i]-X.s[i])*60000;
}

function nextCut(j){if(j===7)j=8;return j>10?null:j}
function live(){
  var m=model(),n=now(),o={};
  if(m.mode!=='done'){
    var from=m.mode==='pre'?0:m.last,progress=routeProgress(from,from+1);
    o.gpsStatus=[progress.status,progress.tone];
    o.gpsToggle=[G.on?'Stop GPS':'Start GPS',''];
    o.courseKm=[progress.km.toFixed(1),''];
    o.toFinish=[progress.toFinish.toFixed(1)+U('km'),''];
    o.toCP=[progress.toCP==null?'—':progress.toCP.toFixed(1)+U('km'),''];
    o.climbLeft=[progress.gain==null?'—':'+'+Math.round(progress.gain)+U('m'),''];
    o.descentLeft=[progress.loss==null?'—':'−'+Math.round(progress.loss)+U('m'),''];
  }
  PIDS.forEach(function(k){
    var f=finFor(k,m),em=f==null?null:(f-START)/60000;
    o['plan'+k]=f==null?['—','']:[tC(f,{noicon:1}),em<=PINFO[k].goal?'good':(em<=P[10].cut?'warn':'bad')];
  });
  o.clock=[tC(n,{sec:1,noicon:1,noday:1}),''];
  o.date=[dateTh(n),''];
  (function(){var cnt=0,nx=-1,i,d='';for(i=1;i<=9;i++){if(S.arr[i]!=null)cnt++;else if(nx<0)nx=i}
    for(i=1;i<=9;i++)d+='<i class="'+(S.arr[i]!=null?'on':(i===nx&&m.mode!=='pre'?'cur':''))+'"></i>';
    var fin=S.arr[10]!=null;
    o.cpProg=['<span class="dots">'+d+'</span><span>CP <b>'+cnt+'</b>/9'+(fin?' · FIN ✓':(nx>0?' · Next '+P[nx].id:' · Next FIN'))+'</span>',''];
  })();
  o.hdDeltaLab=[IC_TMR+'Plan '+S.pid+' · '+PINFO[S.pid].t,''];
  o.sim=['Preview · sample data',''];
  o.elapsed=[tDur(m.mode==='pre'?0:Math.floor(((m.mode==='done'?S.arr[10]:n)-START)/1000),{sec:1,noicon:1,fh:1}),''];
  o.raceclk=[m.mode==='pre'?'Starts in '+tDur(Math.floor((START-n)/1000),{sec:1,days:1,noicon:1}):'Start '+tC(START,{noicon:1,noday:1}),''];
  var delta=null,cj=null;
  if(m.mode==='pre'){o.toStart=[tDur(Math.max(0,Math.floor((START-n)/1000)),{sec:1,days:1}),''];o.nsEta=[tC(START+planArr(1)*60000),''];cj=1}
  if(m.mode==='enroute'){
    var L=m.last,to=L+1,dep=S.dep[L],used=(n-dep)/60000,pl=legPlan(L,to);
    var eta=Math.max(dep+pl*60000,n);
    delta=(eta-(START+planArr(to)*60000))/60000;cj=nextCut(to);
    o.barw=[Math.min(100,used/pl*100)+'%',''];
    o.used=[tM(used),used>pl?'bad':''];
    var lf=pl-used;o.legLeft=[lf>=0?tM(lf):'Over '+tM(-lf),lf>=0?'':'bad'];
    o.nsEta=[tC(eta),delta>0.5?'warn':'good'];
  }
  if(m.mode==='atcp'){
    var i=m.last,ar=S.arr[i],dl2=(ar-(START+planArr(i)*60000))/60000,t2=deltaH(dl2);
    var left=stp()[i]*60000-(n-ar);
    o.stopLeft=[tDur(Math.floor(left/1000),{sec:1}),left>60000?'good':(left>0?'warn':'bad')];
    o.arrDelta=['Arrived '+tC(ar,{noday:1})+' · '+t2[0],t2[1]];
    var nxt=i+1,lim2=nxt===7?1500:P[nxt].cut;
    var lat=START+(lim2-legPlan(i,nxt))*60000,latin=(lat-n)/60000;
    o.latest=[tC(lat)+'<span class="sub2">'+(latin>=0?'In '+tM(latin):'Overdue')+'</span>',latin<10?'bad':(latin<30?'warn':'')];
    delta=dl2+Math.max(0,(n-ar)/60000-stp()[i]);cj=nextCut(nxt);
    var depEst=Math.max(n,ar+stp()[i]*60000);
    o.nsEta=[tC(depEst+legPlan(i,nxt)*60000),delta>0.5?'warn':'good'];
  }
  if(m.mode==='done'){delta=(S.arr[10]-(START+planArr(10)*60000))/60000}
  if(delta!=null){
    var ds=deltaH(delta);o.hdDelta=[ds[0],ds[1]];
    var fp=finishProj(delta),fm=(fp-START)/60000;
    o.fin=[tC(fp),fm<=goalMin()?'good':'warn'];
    o.fin24=[fm<=goalMin()?'Under '+tM(goalMin()-fm):'Over '+tM(fm-goalMin()),fm<=goalMin()?'good':'warn'];
  } else o.hdDelta=['—',''];
  if(cj!=null&&m.mode!=='done'){
    var cms=START+P[cj].cut*60000,cin=(cms-n)/60000;
    o.hdCutLab=[IC_CLK+'Next COT · '+P[cj].id,''];
    o.hdCut=[tC(cms)+'<span class="sub2">'+(cin>=0?(cin>=1440?'In '+Math.floor(cin/1440)+' d':'In '+tM(cin)):'Overdue')+'</span>',m.mode==='pre'?'':(cin<30?'bad':(cin<90?'warn':'good'))];
  } else {o.hdCutLab=[IC_CLK+'Next COT',''];o.hdCut=['—','']}
  return o;
}
var renderedEarly=null;
function applyLive(){
  if(S.tab==='now'&&model().mode==='pre'&&renderedEarly!==(now()<START-60*60000)){render();return}
  var o=live(),els=document.querySelectorAll('[data-k]');
  for(var i=0;i<els.length;i++){
    var e=els[i],k=e.getAttribute('data-k'),v=o[k];if(!v)continue;
    if(k==='barw'){e.style.width=v[0];continue}
    e.innerHTML=v[0];
    e.className=(e.dataset.base||'')+(v[1]?' '+v[1]:'');
  }
}
function render(){
  var m=model(),h='';
  renderedEarly=S.tab==='now'&&m.mode==='pre'?(now()<START-60*60000):null;
  if(S.tab==='now')h=viewNow(m);else if(S.tab==='map')h=viewMap(m);else if(S.tab==='all')h=viewAll(m);else h=viewSet(m);
  document.getElementById('main').innerHTML=h;
  ['now','map','all','set'].forEach(function(t){document.getElementById('t-'+t).className=(S.tab===t?'on':'')});
  var els=document.querySelectorAll('[data-k]');
  for(var i=0;i<els.length;i++){if(els[i].dataset.base==null)els[i].dataset.base=els[i].className}
  applyLive();

      if(prom>=120)out.push(i);
    }}
  return out;})();
/* CP positions on the route (by official km) */
function cpKm(i){return P[i].km}

/* ---------- GPS ---------- */
var G={on:false,id:null,pos:null,err:'',idx:null,km:null,off:null,t:0,acc:null};
function gpsStart(){
  if(!navigator.geolocation){G.err='GPS unavailable';render();return}
  G.err='Acquiring GPS…';G.on=true;render();
  G.id=navigator.geolocation.watchPosition(gpsOk,function(e){if(e.code!==1&&G.km!=null){G.err='GPS lost · Last fix shown';}else{G.err=e.code===1?'GPS permission denied':e.code===2?'No GPS fix':'GPS timed out';}if(S.tab==='map')render();else if(S.tab==='now')applyLive()},{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
function gpsStop(){if(G.id!=null)navigator.geolocation.clearWatch(G.id);G.id=null;G.on=false;G.err='';render()}
function gpsOk(pos){G.err='';gpsFix(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);if(S.tab==='map')render();else if(S.tab==='now')applyLive()}
function gpsFix(la,lo,acc){
  var p=RT.p,best=1e9,bi=0,bt=0,i,r=Math.PI/180,cl=Math.cos(la*r);
  var lo_i=0,hi_i=p.length-2;
  if(G.idx!=null){lo_i=Math.max(0,G.idx-25);hi_i=Math.min(p.length-2,G.idx+120)} // keep to nearby part of route
  function scan(a,b){
    for(i=a;i<=b;i++){
      var ax=(p[i].lo-lo)*r*cl*6371,ay=(p[i].la-la)*r*6371,bx=(p[i+1].lo-lo)*r*cl*6371,by=(p[i+1].la-la)*r*6371;
      var dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy,t=L>0?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L)):0;
      var px=ax+dx*t,py=ay+dy*t,d=Math.sqrt(px*px+py*py);
      if(d<best){best=d;bi=i;bt=t}
    }}
  scan(lo_i,hi_i);
  if(best>0.4&&(lo_i>0||hi_i<p.length-2)){best=1e9;scan(0,p.length-2)} // lost: search whole route
  G.idx=bi;G.km=p[bi].k+(p[bi+1].k-p[bi].k)*bt;G.off=best*1000;G.acc=acc;G.t=Date.now();G.pos=[la,lo];
}

// Keep the recorded CP as the ETA/arrival target; GPS never records a CP for the runner.
function routeProgress(from,to){
  var p=P[from],target=P[to].km,total=P[10].km;
  var r={source:'cp',km:p.km,toCP:target-p.km,toFinish:total-p.km,gain:p.gain,loss:p.loss,status:'From '+p.id+' · '+(G.err||(G.on?'Acquiring GPS…':'GPS off')),tone:G.err?'warn':''};
  if(!Number.isFinite(G.km)||!Number.isFinite(G.off))return r;
  if(G.off>2000){r.status='From '+p.id+' · Off route '+(G.off/1000).toFixed(1)+' km';r.tone='bad';return r}
  if(G.km<p.km-0.15){r.status='From '+p.id+' · GPS before CP';r.tone='warn';return r}
  var age=Math.max(0,Math.floor((Date.now()-G.t)/1000)),stale=age>60,acc=Number.isFinite(G.acc)?Math.round(G.acc):null;
  var last=!G.on||stale||!!G.err;
  r.source='gps';r.km=Math.max(p.km,Math.min(total,G.km));r.toFinish=Math.max(0,total-r.km);
  r.status=(last?'Last fix':'GPS')+' · '+(age<60?age+'s':Math.floor(age/60)+'m')+' · ±'+(acc==null?'?':acc)+' m';
  r.tone=last||acc==null||acc>100||G.off>150?'warn':'';
  if(G.err)r.status+=' · '+G.err.split(' · ')[0];
  if(G.off>150)r.status+=' · Off route '+Math.round(G.off)+' m';
  if(r.km>target+0.05){
    r.toCP=null;r.gain=null;r.loss=null;r.status+=' · Past '+P[to].id+' · Check record';r.tone='warn';
  }else{
    r.toCP=Math.max(0,target-r.km);
    var gl=sumGL(r.km,target);r.gain=gl[0];r.loss=gl[1];
  }
  return r;
}

function planKmAt(minElapsed){ // where the plan says you should be at this race time
  var pl=plan(),i;
  if(minElapsed<=0)return 0;
  for(i=1;i<=10;i++){
    var dep0=planDep(i-1),arr1=planArr(i);
    if(minElapsed<=arr1){var f=(minElapsed-dep0)/Math.max(1,arr1-dep0);return P[i-1].km+(P[i].km-P[i-1].km)*Math.max(0,Math.min(1,f))}
    if(i<10&&minElapsed<=planDep(i))return P[i].km; // resting at CP i
  }
  return P[10].km;
}
function sumGL(k0,k1){
  var p=RT.p,g=0,l=0,c,i;
  k0=Math.max(0,k0);k1=Math.min(P[10].km,k1);
  if(k1<=k0)return [0,0];
  // Scale each leg to its official totals; interpolate partial GPS segments.
  for(c=0;c<P.length-1;c++){
    if(k1<=P[c].km||k0>=P[c+1].km)continue;
    var lo=CPI[c],hi=CPI[c+1],rawG=p[hi].g-(p[lo].g||0),rawL=p[hi].l-(p[lo].l||0),up=0,down=0;
    for(i=lo+1;i<=hi;i++){
      var a=Math.max(k0,p[i-1].k),b=Math.min(k1,p[i].k),len=p[i].k-p[i-1].k;
      if(b<=a||len<=0)continue;
      var de=(p[i].e-p[i-1].e)*(b-a)/len;
      if(de>0)up+=de;else down-=de;
    }
    g+=rawG>0?up*P[c].gain/rawG:0;
    l+=rawL>0?down*P[c].loss/rawL:0;
  }
  return [g,l];
}

/* ---------- PROFILE GRAPH ---------- */
function profileSvg(x0,x1,cur){
  var W=640,H=250,L=40,R=8,T=14,B=26,p=RT.p,i;
  var ymin=300,ymax=1550;
  function X(k){return L+(k-x0)/(x1-x0)*(W-L-R)}
  function Y(e){return T+(1-(e-ymin)/(ymax-ymin))*(H-T-B)}
  var pts=[],d='';
  for(i=0;i<p.length;i++){if(p[i].k<x0-1||p[i].k>x1+1)continue;pts.push(X(p[i].k).toFixed(1)+','+Y(p[i].e).toFixed(1))}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  [400,600,800,1000,1200,1400].forEach(function(e){svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(e)+'" y2="'+Y(e)+'" stroke="var(--line)"/><text x="'+(L-4)+'" y="'+(Y(e)+4)+'" fill="var(--mut)" font-size="11" text-anchor="end">'+e+'</text>'});
  if(pts.length)svg+='<polygon points="'+X(Math.max(x0,0))+','+Y(ymin)+' '+pts.join(' ')+' '+X(Math.min(x1,105.8))+','+Y(ymin)+'" fill="var(--graph)" opacity=".85"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="1.5"/>';
  // CPs
  for(i=1;i<=10;i++){var k=cpKm(i);if(k<x0-0.5||k>x1+0.5)continue;
    var done=(i===0)?true:S.arr[i]!=null;
    svg+='<line x1="'+X(k)+'" x2="'+X(k)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="'+(done?'var(--ok)':'var(--mut)')+'" stroke-dasharray="3 3" opacity=".8"/>'
       +'<text x="'+X(k)+'" y="'+(H-B+13)+'" fill="'+(done?'var(--ok)':'var(--tx)')+'" font-size="11" font-weight="700" text-anchor="middle">'+P[i].id+'</text>';}
  // peaks
  PEAKS.forEach(function(ix){var k=p[ix].k;if(k<x0||k>x1)return;svg+='<text x="'+X(k)+'" y="'+(Y(p[ix].e)-5)+'" fill="var(--warn)" font-size="11" text-anchor="middle">▲'+Math.round(p[ix].e)+'</text>'});
  // plan-time position
  var m=model();
  if(m.mode!=='pre'&&m.mode!=='done'){var pk=planKmAt((now()-START)/60000);if(pk>=x0&&pk<=x1)svg+='<circle cx="'+X(pk)+'" cy="'+Y(eleAt(pk))+'" r="6" fill="none" stroke="var(--tx)" stroke-width="2"/>'}
  // last recorded CP
  if(m.mode==='atcp'||m.mode==='enroute'){var lk=cpKm(m.last);if(lk>=x0&&lk<=x1)svg+='<rect x="'+(X(lk)-5)+'" y="'+(Y(eleAt(lk))-5)+'" width="10" height="10" fill="var(--ok)" transform="rotate(45 '+X(lk)+' '+Y(eleAt(lk))+')"/>'}
  // gps
  if(G.km!=null&&G.off<=2000&&G.km>=x0&&G.km<=x1)svg+='<circle cx="'+X(G.km)+'" cy="'+Y(eleAt(G.km))+'" r="8" fill="var(--bad)" stroke="var(--tx)" stroke-width="2"/>';
  return svg+'</svg>';
}

function viewMap(m){
  var h='',win=S.gz||'next';
  var curKm=(G.km!=null)?G.km:null;
  var base=curKm!=null?curKm:(m.last!=null?cpKm(m.last):0);
  var x0=0,x1=105.8;
  if(win==='next'){x0=Math.max(0,base-3);x1=Math.min(105.8,x0+30);x0=Math.max(0,x1-30)}
  h+='<div class="seg"><button class="'+(win==='next'?'on':'')+'" onclick="S.gz=&quot;next&quot;;save();render()">Next 30 km</button><button class="'+(win==='all'?'on':'')+'" onclick="S.gz=&quot;all&quot;;save();render()">Full route</button></div>';
  h+='<div class="card" style="padding:8px">'+profileSvg(x0,x1)+'<div class="small" style="padding:4px 6px">● GPS · ○ Plan · ◆ Last CP · ▲ Peak</div></div>';
  h+='<div class="card"><h2>GPS</h2>';
  if(!G.on)h+='<button class="btn alt" onclick="gpsStart()">Start GPS</button>';
  else h+='<button class="btn ghost" onclick="gpsStop()">Stop GPS</button>';
  if(G.err)h+='<div class="tip warn">'+G.err+'</div>';
  var farOff=G.km!=null&&G.off>2000;
  if(farOff)h+='<div class="tip warn">Off route · '+(G.off/1000).toFixed(1)+' km · ±'+Math.round(G.acc||0)+' m</div>';
  if(G.km!=null&&!farOff){
    var nx=null,i;for(i=1;i<=10;i++){if(cpKm(i)>G.km+0.05){nx=i;break}}
    var age=Math.max(0,Math.round((Date.now()-G.t)/1000));
    h+='<div class="kv"><span>Position</span><b>'+G.km.toFixed(1)+' / 105.8 km</b></div>'
     +'<div class="kv"><span>To finish</span><b>'+Math.max(0,P[10].km-G.km).toFixed(1)+' km</b></div>'
     +'<div class="kv"><span>Elevation</span><b>'+Math.round(eleAt(G.km))+' m</b></div>'
     +'<div class="kv"><span>Off route</span><b class="'+(G.off>150?'bad':'good')+'">'+Math.round(G.off)+' m</b></div>'
     +'<div class="kv"><span>Accuracy / age</span><b>±'+Math.round(G.acc||0)+' m · '+age+' s ago</b></div>';
    if(nx){var gl=sumGL(G.km,cpKm(nx));
      h+='<div class="kv"><span>To '+P[nx].id+'</span><b>'+(cpKm(nx)-G.km).toFixed(1)+' km</b></div>'
       +'<div class="kv"><span>Climb / descent</span><b>+'+Math.round(gl[0])+' / −'+Math.round(gl[1])+' m</b></div>';}
    var pk=null;for(i=0;i<PEAKS.length;i++){if(RT.p[PEAKS[i]].k>G.km+0.1){pk=RT.p[PEAKS[i]];break}}
    if(pk){var g2=sumGL(G.km,pk.k);h+='<div class="kv"><span>Next peak · '+Math.round(pk.e)+' m</span><b>'+(pk.k-G.km).toFixed(1)+' km · +'+Math.round(g2[0])+' m</b></div>'}
    var plk=planKmAt((now()-START)/60000),df=G.km-plk;
    if(now()>=START)h+='<div class="kv"><span>Plan '+plk.toFixed(1)+' km</span><b class="'+(df>=0?'good':'warn')+'">'+(df>=0?'Ahead ':'Behind ')+Math.abs(df).toFixed(1)+' km</b></div>';
  }
  return h+'<div class="small" style="margin-top:8px">GPX v1.0 · 105.8 km</div></div>';
}

// Preview fixture: memory only; never read or write real race records.
S.arr={1:START+145*60000,2:START+302*60000,3:START+467*60000};
S.dep={0:START,1:START+152*60000,2:START+309*60000,3:START+474*60000};
S.hist=[['dep',3]];S.pid='B';S.tab='now';S.sim=0;
now=function(){return START+560*60000};save=function(){};
S.theme='day';applyTheme();
gpsFix(RT.p[450].la,RT.p[450].lo,18);

render();
setInterval(applyLive,1000);
setInterval(function(){if(S.tab==='map'&&G.on)render()},15000);
</script>
